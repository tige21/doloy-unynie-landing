# Nginx-вариант (если Caddy не подходит). HTTPS добавляется certbot'ом:
#   sudo certbot --nginx -d ПОДДОМЕН.duckdns.org
# Положить в /etc/nginx/sites-available/doloy-unynie и включить симлинком.

server {
    listen 80;
    server_name ПОДДОМЕН.duckdns.org;

    root /var/www/doloy-unynie;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location ~* ^/(assets|fonts|media)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
